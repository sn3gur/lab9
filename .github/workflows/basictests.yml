name: Basic Tests
on:
  push:
    branches: [ main, test ]
jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Make script executable
        run: chmod +x validate-data.sh
      - name: Run and verify output
        run: |
          OUTPUT=$(bash validate-data.sh "andrii snihur" "0509065699")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" == "PASS" ]; then echo "Test Passed!"; else exit 1; fi
          OUTPUT=$(bash validate-data.sh "andrii snihuriak" "050906569908311")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" == "FAIL" ]; then echo "Test Passed!"; else exit 1; fi
          OUTPUT=$(bash validate-data.sh "andriiT snihuriak" "0509065699")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" == "PASS" ]; then echo "Test Passed!"; else exit 1; fi
